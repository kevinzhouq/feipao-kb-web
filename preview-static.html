<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>飞跑知识库静态预览</title>
    <style>:root {
  color-scheme: light;
  --bg: #f6f8f7;
  --surface: #ffffff;
  --surface-soft: #edf6f2;
  --text: #14201c;
  --muted: #64746e;
  --line: #dbe5e0;
  --accent: #08745f;
  --accent-strong: #075445;
  --success: #1f9d67;
  --danger: #b42318;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
}

button,
input {
  font: inherit;
  min-width: 0;
}

.app-shell {
  width: min(100%, 520px);
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
}

.login-view {
  min-height: 100vh;
  padding: 88px 24px 32px;
}

.brand-mark {
  display: grid;
  width: 56px;
  height: 56px;
  place-items: center;
  border-radius: 16px;
  background: var(--accent);
  color: white;
  font-size: 28px;
  font-weight: 800;
}

.login-view h1 {
  margin: 22px 0 8px;
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: 0;
}

.login-view p {
  margin: 0;
  color: var(--muted);
}

.login-form {
  display: block;
  width: 100%;
  margin-top: 32px;
}

.login-form > * {
  width: 100%;
}

.login-form button {
  margin-top: 12px;
}

.login-form input,
.search-box input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--text);
  outline: none;
}

.login-form input {
  height: 48px;
  padding: 0 14px;
}

.login-form button,
.copy-button {
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  cursor: pointer;
}

.login-form button {
  height: 48px;
  font-weight: 700;
}

.error-text {
  min-height: 24px;
  margin-top: 12px !important;
  color: var(--danger) !important;
}

.search-view {
  min-height: 100vh;
  padding-bottom: 32px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(246, 248, 247, 0.94);
  backdrop-filter: blur(14px);
}

.topbar strong {
  display: block;
  font-size: 18px;
}

.topbar span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.ghost-button {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--accent-strong);
  padding: 8px 12px;
}

.search-panel {
  position: sticky;
  top: 65px;
  z-index: 4;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}

.search-box {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 13px;
}

.search-box input {
  height: 44px;
  padding: 0 13px;
  font-size: 15px;
}

.category-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.category-chip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  color: var(--muted);
  padding: 7px 12px;
  font-size: 13px;
}

.category-chip.active {
  border-color: var(--accent);
  background: var(--surface-soft);
  color: var(--accent-strong);
  font-weight: 700;
}

.result-meta {
  padding: 14px 16px 8px;
  color: var(--muted);
  font-size: 13px;
}

.results {
  display: grid;
  gap: 10px;
  padding: 0 12px;
}

.result-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  padding: 14px;
  box-shadow: 0 6px 20px rgba(20, 32, 28, 0.05);
}

.card-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}

.type-label {
  display: inline-flex;
  border-radius: 6px;
  background: var(--surface-soft);
  color: var(--accent-strong);
  padding: 4px 7px;
  font-size: 12px;
  font-weight: 700;
}

.question {
  margin: 10px 0 8px;
  font-size: 17px;
  line-height: 1.45;
}

.answer,
.follow-up,
.note {
  margin: 0;
  color: #263832;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.follow-up,
.note {
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.copy-button {
  flex: 0 0 auto;
  padding: 7px 10px;
  font-size: 13px;
}

.empty-state {
  margin: 36px 16px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: white;
  color: var(--muted);
  padding: 28px 18px;
  text-align: center;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 10;
  border-radius: 999px;
  background: rgba(20, 32, 28, 0.92);
  color: white;
  padding: 9px 16px;
  font-size: 14px;
}

@media (min-width: 720px) {
  body {
    background: #e9efec;
  }

  .app-shell {
    margin: 24px auto;
    min-height: calc(100vh - 48px);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(20, 32, 28, 0.12);
  }
}
</style>

查看预览版是否满意，再进行下载，下载后即为高清版","followUp":"","note":""},{"id":"kb-14","type":"视频问题,照片问题","question":"视频价格高/性价比低","answer":"您可以先预览，满意后再进行下载","followUp":"","note":""},{"id":"kb-15","type":"视频问题,照片问题","question":"我的视频中不是我；\n我的视频中没有我","answer":"您好，请问您的参赛号码是？","followUp":"先询问号码，发送到群，核实后回复","note":""},{"id":"kb-16","type":"优惠券/抽奖问题","question":"得了优惠券但是下单的时候没显示","answer":"请问您是否已经兑换了优惠券呢？","followUp":"若用户未兑换，告知兑换方式","note":""},{"id":"kb-17","type":"优惠券/抽奖问题","question":"抽奖没有记住兑换码","answer":"您可以在抽奖小程序中找到已抽到兑换码，在【飞跑马拉松】小程序先进行兑换，下载时自动抵扣","followUp":"","note":""},{"id":"kb-18","type":"优惠券/抽奖问题","question":"如何领取优惠券","answer":"您可以点击置顶小程序进行抽奖，抽奖后记得到【飞跑马拉松】小程序先进行兑换，下载时自动抵扣","followUp":"同步发送小程序链接","note":""},{"id":"kb-19","type":"优惠券/抽奖问题","question":"5元券是下载所有照片吗？","answer":"不是的，5元券仅限于购买单张精彩照片时使用，且不能用于购买AI参赛视频。","followUp":"","note":""},{"id":"kb-20","type":"优惠券/抽奖问题","question":"照片下载是5折吗？\n照片下载不是5折吗？\n是所有照片下载都是5折吗？","answer":"不是的，5折下载优惠为AI参赛视频的抽奖奖品，5折优惠券不能用于下载精彩照片使用哈","followUp":"","note":""},{"id":"kb-21","type":"退款","question":"强烈的对视频不满意，要求退款；","answer":"询问不满意的原因，如果态度强烈可进行退款。提供号牌和订单截图（飞跑马拉松小程序-我的-我的订单），核实订单信息后会进行退款操作：1-3个工作日到账。\n\n需要提供订单截图或订单号，如果用户问如何找到订单号，可以回复：\n您好，您可以在微信搜索栏输入飞跑马拉松，找到飞跑马拉松小程序，在下面找到【我的】按钮，点击【我的】，找到左上方【我的订单】，点击【我的订单】就可以找到您购买的视频和订单信息","followUp":"管理员统一验证后批量退款操作：\n微信支付后台：\n“交易订单”中，输入商户订单号（例：2024042513090380800498）确认无误后，进行退款操作","note":""},{"id":"kb-22","type":"退款","question":"要求照片退款\n（照片原则上不进行退款，如有强烈要求照片退款的，问一下原因）","answer":"您好，请问您想要退款的原因是什么呢？","followUp":"","note":""},{"id":"kb-26","type":"未分类","question":"关于体验版和集锦版","answer":"集锦版有更多机位，以及更加高清的画质","followUp":"","note":""},{"id":"kb-27","type":"未分类","question":"关于秦皇岛马拉松的其他问题","answer":"您可以打秦马热线咨询：\n0335-8018279","followUp":"","note":""},{"id":"kb-28","type":"未分类","question":"输入参赛号点一下会报错，点了两下视频出来了（三星Z fold 5）","answer":"您好，您可以切换到英文输入法试一下","followUp":"","note":""},{"id":"kb-29","type":"未分类","question":"视频前面部分没问题，冲线画面不是我","answer":"（需要先确认是否已付款）-数据库Trade\n\n如果已付款：\n找明锋手剪视频，后发给用户\n\n如果未付款：\n1、需要询问用户参赛号牌&龙门冲线时间\n2、找明锋手剪视频，上传云端，确保新视频已替换后）\n3、回复：\n您好，您的视频已经调整了，您可以清理一下小程序的缓存，然后重新搜索下载哈\n在微信 我-设置-通用-存储空间-缓存，点击前往清理，选择小程序缓存即可\n\n4、如果云端上传不成功，可以跟用户沟通，先购买当前版本视频，再将已调整的视频发给用户，话术：\n您好，修改后的视频上传可能需要一些时间处理，已经催促相关工作人员尽快处理，为了不影响您的观看和分享，咱们这边为您申请了一下，您可以先购买当前版本，然后再把修改后的视频发给您，您看是否可以？","followUp":"","note":""},{"id":"kb-30","type":"未分类","question":"怎么交钱？","answer":"您好 不用提前付费的，您完成比赛之后，大概1个多小时之后吧，您会收到短信提醒。点击链接就可以查询和预览了，看过预览之后您付费可以下载短视频。[呲牙]","followUp":"","note":""},{"id":"kb-31","type":"未分类","question":"不知道怎么搜索","answer":"（先给用户分享小程序该比赛的搜索页，让用户点击后直接进入搜索页面）\n您可以点击进入小程序，根据图片上的说明操作，输入您的参赛号牌，就可以查到您的专属视频了","followUp":"","note":""}]};
      const PASSWORD = "feipao-demo";
      const loginView = document.querySelector("#loginView");
      const searchView = document.querySelector("#searchView");
      const loginForm = document.querySelector("#loginForm");
      const passwordInput = document.querySelector("#passwordInput");
      const loginError = document.querySelector("#loginError");
      const logoutButton = document.querySelector("#logoutButton");
      const searchInput = document.querySelector("#searchInput");
      const categoryRow = document.querySelector("#categoryRow");
      const resultMeta = document.querySelector("#resultMeta");
      const results = document.querySelector("#results");
      const emptyState = document.querySelector("#emptyState");
      const toast = document.querySelector("#toast");
      let currentCategory = "全部";
      let categories = ["全部"];
      let timer;

      function normalize(value) {
        return String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function scoreRecord(record, terms) {
        const fields = [[record.question, 8], [record.answer, 5], [record.type, 3], [record.followUp, 2], [record.note, 1]];
        let score = 0;
        for (const term of terms) {
          for (const [value, weight] of fields) {
            const text = normalize(value);
            if (text === term) score += weight * 4;
            else if (text.includes(term)) score += weight;
          }
        }
        return score;
      }

      function searchKnowledgeBase() {
        const terms = normalize(searchInput.value).split(/[ ,，。；;、]+/).filter(Boolean);
        const selected = currentCategory === "全部" ? "" : currentCategory;
        return KB_DATA.records
          .map((record) => {
            if (selected && record.type !== selected) return null;
            const score = terms.length ? scoreRecord(record, terms) : 1;
            return score > 0 ? { ...record, score } : null;
          })
          .filter(Boolean)
          .sort((left, right) => right.score - left.score || left.question.localeCompare(right.question, "zh-Hans-CN"))
          .slice(0, 30);
      }

      function renderCategories() {
        categories = ["全部", ...KB_DATA.categories.filter((item) => item !== "全部")];
        categoryRow.innerHTML = categories.map((category) => (
          '<button class="category-chip ' + (category === currentCategory ? "active" : "") + '" type="button" data-category="' + escapeHtml(category) + '">' + escapeHtml(category) + '</button>'
        )).join("");
      }

      function renderResults(items) {
        results.innerHTML = items.map((item) => (
          '<article class="result-card">' +
          '<div class="card-head"><span class="type-label">' + escapeHtml(item.type) + '</span><button class="copy-button" type="button" data-copy="' + escapeHtml(item.answer) + '">复制答复</button></div>' +
          '<h2 class="question">' + escapeHtml(item.question) + '</h2>' +
          '<p class="answer">' + escapeHtml(item.answer) + '</p>' +
          (item.followUp ? '<p class="follow-up">后续处理：' + escapeHtml(item.followUp) + '</p>' : "") +
          (item.note ? '<p class="note">备注：' + escapeHtml(item.note) + '</p>' : "") +
          '</article>'
        )).join("");
        emptyState.hidden = items.length > 0;
      }

      function runSearch() {
        const items = searchKnowledgeBase();
        renderCategories();
        renderResults(items);
        resultMeta.textContent = searchInput.value.trim() || currentCategory !== "全部" ? "找到 " + items.length + " 条结果" : "显示全部标准问答";
      }

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (passwordInput.value !== PASSWORD) {
          loginError.textContent = "密码不正确";
          return;
        }
        loginView.hidden = true;
        searchView.hidden = false;
        runSearch();
      });

      logoutButton.addEventListener("click", () => {
        searchView.hidden = true;
        loginView.hidden = false;
        passwordInput.value = "";
      });

      searchInput.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(runSearch, 120);
      });

      categoryRow.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        currentCategory = button.dataset.category;
        runSearch();
      });

      results.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-copy]");
        if (!button) return;
        await navigator.clipboard.writeText(button.dataset.copy);
        toast.hidden = false;
        setTimeout(() => { toast.hidden = true; }, 1000);
      });
    </script>
  </body>
</html>
